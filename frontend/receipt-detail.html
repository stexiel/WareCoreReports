<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали документа приемки - WareCore Reports</title>
    <link rel="icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #475569;
            --primary-dark: #334155;
            --primary-light: #64748b;
            --secondary: #94a3b8;
            --background: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .doc-info {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 20px;
        }

        .doc-info h1 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .doc-info p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .filter-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 20px;
        }

        .filter-section h3 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-section h3::before {
            content: '';
            width: 4px;
            height: 16px;
            background: var(--primary);
            border-radius: 2px;
        }

        .filter-options {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .filter-option input[type="radio"] {
            cursor: pointer;
        }

        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            background: var(--border);
        }

        th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        tbody tr:hover {
            background: var(--background);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-import {
            background: #fef3c7;
            color: #92400e;
        }

        .status-received {
            background: #d1fae5;
            color: #065f46;
        }

        .status-shipped {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #ef4444;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .filter-options {
                flex-direction: column;
                gap: 8px;
            }

            .table-container {
                overflow-x: auto;
            }

            table {
                min-width: 600px;
            }

            th, td {
                padding: 8px 12px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .doc-info {
                padding: 12px 16px;
            }

            .doc-info h1 {
                font-size: 16px;
            }

            .filter-section {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="back-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Назад к списку
            </a>
        </div>

        <div class="doc-info">
            <h1>Детали документа: <span id="docNumber">Загрузка...</span></h1>
            <p id="statusText">Загрузка данных...</p>
        </div>

        <div class="filter-section">
            <h3>Фильтр по состоянию паллеты</h3>
            <div class="filter-options">
                <label class="filter-option">
                    <input type="radio" name="palletStateFilter" value="all" checked onchange="filterData()">
                    <span>Все</span>
                </label>
                <label class="filter-option">
                    <input type="radio" name="palletStateFilter" value="Импорт" onchange="filterData()">
                    <span>Импорт</span>
                </label>
                <label class="filter-option">
                    <input type="radio" name="palletStateFilter" value="Получен" onchange="filterData()">
                    <span>Получен</span>
                </label>
                <label class="filter-option">
                    <input type="radio" name="palletStateFilter" value="Выставлено" onchange="filterData()">
                    <span>Выставлено</span>
                </label>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Номер контейнера</th>
                        <th>Количество</th>
                        <th>Артикул</th>
                        <th>Номер партии</th>
                        <th>Состояние паллеты</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="5" class="loading">Загрузка...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allData = [];
        let filteredData = [];

        function getApiBase() {
            return `${location.protocol}//${location.hostname}:3000`;
        }

        function getAuthToken() {
            return localStorage.getItem('authToken');
        }

        function getUserRole() {
            return localStorage.getItem('userRole');
        }

        function isAuthenticated() {
            return !!getAuthToken();
        }

        // Проверяем авторизацию при загрузке
        if (!isAuthenticated()) {
            window.location.href = 'login.html';
        }

        function getStatusClass(state) {
            switch(state) {
                case 'Импорт': return 'status-import';
                case 'Получен': return 'status-received';
                case 'Выставлено': return 'status-shipped';
                default: return '';
            }
        }

        async function loadData() {
            const urlParams = new URLSearchParams(window.location.search);
            const docNumber = urlParams.get('docNumber');

            if (!docNumber) {
                document.getElementById('docNumber').textContent = 'Не указан';
                document.getElementById('statusText').textContent = 'Ошибка: не указан номер документа';
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="error">Ошибка: не указан номер документа</td></tr>';
                return;
            }

            document.getElementById('docNumber').textContent = docNumber;

            try {
                const base = getApiBase();
                const token = getAuthToken();
                const response = await fetch(`${base}/api/receipt-detail?docNumber=${encodeURIComponent(docNumber)}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Ошибка загрузки данных');
                }

                const data = await response.json();
                allData = data;
                filteredData = data;

                if (data.length === 0) {
                    document.getElementById('statusText').textContent = 'Нет данных';
                    document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="no-data">Нет данных</td></tr>';
                    return;
                }

                document.getElementById('statusText').textContent = `Загружено ${data.length} записей`;
                renderTable();
            } catch (err) {
                console.error('Ошибка загрузки:', err);
                document.getElementById('statusText').textContent = 'Ошибка: ' + err.message;
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="error">Ошибка загрузки данных</td></tr>';
            }
        }

        function filterData() {
            const filter = document.querySelector('input[name="palletStateFilter"]:checked').value;
            
            if (filter === 'all') {
                filteredData = allData;
            } else {
                filteredData = allData.filter(row => row.palletState === filter);
            }

            renderTable();
        }

        function renderTable() {
            const tableBody = document.getElementById('tableBody');

            if (filteredData.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="no-data">Нет данных</td></tr>';
                return;
            }

            let html = '';
            filteredData.forEach(row => {
                html += '<tr>';
                html += '<td>' + (row.containerNumber || '') + '</td>';
                html += '<td>' + (row.quantity || 0) + '</td>';
                html += '<td>' + (row.article || '') + '</td>';
                html += '<td>' + (row.batchNumber || '') + '</td>';
                html += '<td><span class="status-badge ' + getStatusClass(row.palletState) + '">' + (row.palletState || '') + '</span></td>';
                html += '</tr>';
            });

            tableBody.innerHTML = html;
        }

        // Загружаем данные при открытии страницы
        loadData();
    </script>
</body>
</html>
