<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - WareCore Reports</title>
    <link rel="icon" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #475569;
            --primary-dark: #334155;
            --primary-light: #64748b;
            --background: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --success: #22c55e;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .profile-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 32px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: 700;
        }

        .profile-info h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .profile-info p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            margin-top: 8px;
        }

        .role-admin {
            background: #fee2e2;
            color: #991b1b;
        }

        .role-operator {
            background: #dbeafe;
            color: #1e40af;
        }

        .role-warehouseman {
            background: #d1fae5;
            color: #065f46;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .info-item {
            background: var(--background);
            padding: 16px;
            border-radius: 8px;
        }

        .info-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
        }

        .change-password-section {
            border-top: 1px solid var(--border);
            padding-top: 24px;
        }

        .change-password-section h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            display: block;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            display: block;
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .profile-card {
                padding: 20px;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Назад
            </a>
        </div>

        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-avatar" id="avatarInitial">S</div>
                <div class="profile-info">
                    <h1 id="username">Загрузка...</h1>
                    <p>Пользователь системы WareCore Reports</p>
                    <span class="role-badge" id="roleBadge">Загрузка...</span>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">Логин</div>
                    <div class="info-value" id="loginValue">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Роль</div>
                    <div class="info-value" id="roleValue">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">ID пользователя</div>
                    <div class="info-value" id="idValue">-</div>
                </div>
            </div>

            <div class="change-password-section">
                <h2>Изменить пароль</h2>
                <div id="message" class="message"></div>
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="currentPassword">Текущий пароль</label>
                        <input type="password" id="currentPassword" name="currentPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">Новый пароль</label>
                        <input type="password" id="newPassword" name="newPassword" required minlength="4">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Подтвердите новый пароль</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="4">
                    </div>
                    <button type="submit" class="btn btn-primary">Изменить пароль</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function getApiBase() {
            return `${location.protocol}//${location.hostname}:3000`;
        }

        function getAuthToken() {
            return localStorage.getItem('authToken');
        }

        function getUserRole() {
            return localStorage.getItem('userRole');
        }

        function getUsername() {
            return localStorage.getItem('username');
        }

        function getUserId() {
            return localStorage.getItem('userId');
        }

        // Проверяем авторизацию
        if (!getAuthToken()) {
            window.location.href = 'login.html';
        }

        function getRoleClass(role) {
            switch(role) {
                case 'admin': return 'role-admin';
                case 'operator': return 'role-operator';
                case 'warehouseman': return 'role-warehouseman';
                default: return '';
            }
        }

        function getRoleLabel(role) {
            switch(role) {
                case 'admin': return 'Администратор';
                case 'operator': return 'Оператор';
                case 'warehouseman': return 'Кладовщик';
                default: return role;
            }
        }

        function loadProfile() {
            const username = getUsername();
            const role = getUserRole();
            const userId = getUserId();

            document.getElementById('username').textContent = username || 'Неизвестно';
            document.getElementById('avatarInitial').textContent = (username || 'U').charAt(0).toUpperCase();
            document.getElementById('loginValue').textContent = username || '-';
            document.getElementById('roleValue').textContent = getRoleLabel(role) || '-';
            document.getElementById('idValue').textContent = userId || '-';

            const roleBadge = document.getElementById('roleBadge');
            roleBadge.textContent = getRoleLabel(role) || 'Неизвестно';
            roleBadge.className = 'role-badge ' + getRoleClass(role);
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            setTimeout(() => {
                messageEl.className = 'message';
            }, 5000);
        }

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showMessage('Пароли не совпадают', 'error');
                return;
            }

            if (newPassword.length < 4) {
                showMessage('Пароль должен быть минимум 4 символа', 'error');
                return;
            }

            try {
                const token = getAuthToken();
                const username = getUsername();
                const userId = getUserId();

                // Поскольку у нас нет отдельного API для смены пароля,
                // используем API обновления пользователя
                const response = await fetch(`${getApiBase()}/api/users/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ 
                        username: username,
                        password: newPassword,
                        role: getUserRole()
                    })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || 'Ошибка изменения пароля');
                }

                showMessage('Пароль успешно изменен', 'success');
                document.getElementById('passwordForm').reset();
            } catch (err) {
                showMessage(err.message, 'error');
            }
        });

        // Загружаем профиль при открытии страницы
        loadProfile();
    </script>
</body>
</html>
