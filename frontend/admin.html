<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление пользователями - WareCore Reports</title>
    <link rel="icon" href="../icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #475569;
            --primary-dark: #334155;
            --primary-light: #64748b;
            --background: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .add-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-btn:hover {
            background: #16a34a;
        }

        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            background: var(--border);
        }

        th {
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        tbody tr:hover {
            background: var(--background);
        }

        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .role-admin {
            background: #fee2e2;
            color: #991b1b;
        }

        .role-operator {
            background: #dbeafe;
            color: #1e40af;
        }

        .role-warehouseman {
            background: #d1fae5;
            color: #065f46;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            margin-right: 4px;
            transition: all 0.2s;
        }

        .edit-btn {
            background: var(--primary);
            color: white;
        }

        .edit-btn:hover {
            background: var(--primary-dark);
        }

        .delete-btn {
            background: var(--danger);
            color: white;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 90%;
            overflow: auto;
            padding: 24px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .form-actions button {
            flex: 1;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .save-btn {
            background: var(--success);
            color: white;
        }

        .cancel-btn {
            background: var(--border);
            color: var(--text-primary);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .error {
            text-align: center;
            padding: 40px;
            color: var(--danger);
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .add-btn {
                width: 100%;
                justify-content: center;
            }

            .table-container {
                overflow-x: auto;
            }

            table {
                min-width: 600px;
            }

            th, td {
                padding: 8px 12px;
                font-size: 12px;
            }

            .action-btn {
                padding: 4px 8px;
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .modal-content {
                padding: 16px;
            }

            .form-actions {
                flex-direction: column;
            }

            .form-actions button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Назад
            </a>
            <button class="add-btn" onclick="openCreateModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Добавить пользователя
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Логин</th>
                        <th>Пароль</th>
                        <th>Роль</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr>
                        <td colspan="5" class="loading">Загрузка...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Модальное окно создания/редактирования -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Добавить пользователя</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="userForm">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="text" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="role">Роль</label>
                    <select id="role" name="role" required>
                        <option value="admin">Администратор</option>
                        <option value="operator">Оператор</option>
                        <option value="warehouseman">Кладовщик</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel-btn" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="save-btn">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let users = [];

        function getApiBase() {
            return `${location.protocol}//${location.hostname}:3000`;
        }

        function getAuthToken() {
            return localStorage.getItem('authToken');
        }

        function getUserRole() {
            return localStorage.getItem('userRole');
        }

        function isAdmin() {
            return getUserRole() === 'admin';
        }

        // Проверяем авторизацию и роль
        if (!getAuthToken() || !isAdmin()) {
            alert('Доступ запрещен. Требуются права администратора.');
            window.location.href = 'login.html';
        }

        function getRoleClass(role) {
            switch(role) {
                case 'admin': return 'role-admin';
                case 'operator': return 'role-operator';
                case 'warehouseman': return 'role-warehouseman';
                default: return '';
            }
        }

        function getRoleLabel(role) {
            switch(role) {
                case 'admin': return 'Администратор';
                case 'operator': return 'Оператор';
                case 'warehouseman': return 'Кладовщик';
                default: return role;
            }
        }

        async function loadUsers() {
            try {
                const token = getAuthToken();
                const response = await fetch(`${getApiBase()}/api/users`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Ошибка загрузки пользователей');
                }

                users = await response.json();
                renderUsers();
            } catch (err) {
                console.error('Ошибка загрузки:', err);
                document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="5" class="error">Ошибка загрузки данных</td></tr>';
            }
        }

        function renderUsers() {
            const tableBody = document.getElementById('usersTableBody');

            if (users.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="no-data">Нет данных</td></tr>';
                return;
            }

            let html = '';
            users.forEach(user => {
                const isMainAdmin = user.username === 'stexiel';
                html += '<tr>';
                html += '<td>' + user.id + '</td>';
                html += '<td>' + user.username + '</td>';
                html += '<td>' + user.password + '</td>';
                html += '<td><span class="role-badge ' + getRoleClass(user.role) + '">' + getRoleLabel(user.role) + '</span></td>';
                html += '<td>';
                if (!isMainAdmin) {
                    html += '<button class="action-btn edit-btn" onclick="openEditModal(' + user.id + ')">Редактировать</button>';
                    html += '<button class="action-btn delete-btn" onclick="deleteUser(' + user.id + ')">Удалить</button>';
                } else {
                    html += '<span style="color: var(--text-secondary); font-size: 12px;">Главный админ</span>';
                }
                html += '</td>';
                html += '</tr>';
            });

            tableBody.innerHTML = html;
        }

        function openCreateModal() {
            document.getElementById('modalTitle').textContent = 'Добавить пользователя';
            document.getElementById('userId').value = '';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('role').value = 'operator';
            document.getElementById('userModal').classList.add('show');
        }

        function openEditModal(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) return;

            document.getElementById('modalTitle').textContent = 'Редактировать пользователя';
            document.getElementById('userId').value = user.id;
            document.getElementById('username').value = user.username;
            document.getElementById('password').value = user.password;
            document.getElementById('role').value = user.role;
            document.getElementById('userModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('userModal').classList.remove('show');
        }

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const userId = document.getElementById('userId').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            console.log('Отправка данных:', { userId, username, password, role });

            const token = getAuthToken();
            let url = `${getApiBase()}/api/users`;
            let method = 'POST';

            if (userId) {
                url += `/${userId}`;
                method = 'PUT';
            }

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ username, password, role })
                });

                const data = await response.json();
                console.log('Ответ сервера:', data);

                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка сохранения');
                }

                closeModal();
                loadUsers();
            } catch (err) {
                console.error('Ошибка:', err);
                alert(err.message);
            }
        });

        async function deleteUser(userId) {
            if (!confirm('Вы уверены, что хотите удалить этого пользователя?')) {
                return;
            }

            try {
                const token = getAuthToken();
                const response = await fetch(`${getApiBase()}/api/users/${userId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || 'Ошибка удаления');
                }

                loadUsers();
            } catch (err) {
                alert(err.message);
            }
        }

        // Загружаем пользователей при открытии страницы
        loadUsers();
    </script>
</body>
</html>
